name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest backend/tests -q
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r backend/requirements.lock
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/screenshots
            test-results
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose up --build --wait
      - run: python scripts/smoke.py http://127.0.0.1:5174
      - name: Record a deployment check in persistent storage
        run: docker compose exec -T app python -c "from backend.database import connect,now; db=connect(); c=db.__enter__(); c.execute('INSERT INTO ingestion_runs(adapter,digest,status,detail,created_at) VALUES (?,?,?,?,?)',('deployment-check','ci-persistence','completed','Container recreation test',now())); db.__exit__(None,None,None)"
      - run: docker compose up --force-recreate --wait
      - name: Verify persistence across container recreation
        run: docker compose exec -T app python -c "from backend.database import connect; db=connect(); c=db.__enter__(); assert c.execute('SELECT 1 FROM ingestion_runs WHERE digest=?',('ci-persistence',)).fetchone(); db.__exit__(None,None,None)"
      - run: python scripts/smoke.py http://127.0.0.1:5174
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
